[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/prequal-rs/prequal"

[workspace.dependencies]
prequal-core = { version = "0.1.0", path = "crates/prequal-core" }
prequal-llm = { version = "0.1.0", path = "crates/prequal-llm" }
prequal-pingora = { version = "0.1.0", path = "crates/prequal-pingora" }
prequal-server = { version = "0.1.0", path = "crates/prequal-server" }
prequal-tower = { version = "0.1.0", path = "crates/prequal-tower" }

# Opted into by the published library crates (`[lints] workspace = true`).
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
debug = 1
