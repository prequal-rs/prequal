[package]
name = "prequal-epp"
description = "Gateway API Inference Extension endpoint picker (Envoy ext_proc) that routes to model servers with Prequal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"  # kube 4.2
repository.workspace = true
readme = "README.md"
keywords = ["llm", "gateway-api", "envoy", "kubernetes", "inference"]
categories = ["network-programming", "command-line-utilities"]

[package.metadata.cargo-machete]
# Not referenced in code; depended on only to set `max_level_off` (see below).
ignored = ["log", "tracing"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
envoy-types = "0.7.7"
futures-util = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = "4.2.0"
prequal-llm.workspace = true
rand = "0.10.3"
rcgen = "0.14.7"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
# No tracing subscriber or logger is installed, but kube's `tracing/log` feature keeps h2's per-frame spans live
# (logging through `log`): compile both out.
log = { version = "0.4.34", features = ["max_level_off"] }
tracing = { version = "0.1.44", features = ["max_level_off"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
