[package]
name = "prequal-router"
description = "OpenAI-compatible router for vLLM/SGLang replicas: load- and prefix-cache-aware, from engine metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"  # kube 4.2
repository.workspace = true
readme = "README.md"
keywords = ["llm", "vllm", "sglang", "openai", "load-balancer"]
categories = ["network-programming", "command-line-utilities", "web-programming::http-server"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = "4.2.0"
prequal-llm.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
