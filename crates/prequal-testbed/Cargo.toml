[package]
name = "prequal-testbed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"
repository.workspace = true
publish = false

[dependencies]
prequal-core.workspace = true
prequal-llm.workspace = true
prequal-server.workspace = true
prequal-tower.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower = { version = "0.5.3", features = ["balance", "discover", "load", "util"] }
serde_json = "1.0.151"
futures-util = "0.3.34"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
