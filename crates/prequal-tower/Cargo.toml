[package]
name = "prequal-tower"
description = "Tower load balancer implementing Prequal: async probing, hot-cold selection, piggybacked load, outlier ejection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["load-balancing", "tower", "prequal", "tail-latency", "rpc"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
pin-project-lite = "0.2.17"
prequal-core.workspace = true
rand = "0.10.3"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync", "net", "io-util"] }
tower = { version = "0.5.3", default-features = false, features = ["discover"] }
tower-service = "0.3.3"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "test-util"] }
