<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img"
     aria-label="Two deployment modes. Endpoint picker: clients reach the replicas through Envoy, which asks prequal-epp which replica to use. Standalone: clients reach the replicas through prequal-router. Both scrape the replicas' metrics.">
  <style>
    text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-weight: 600; font-size: 14px; fill: #6e7781; }
    .small { font-size: 11px; fill: #6e7781; }
    .box { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1.2; }
    .ours { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.8; }
    .group { fill: none; stroke: #6e7781; stroke-width: 1; stroke-dasharray: 2 3; }
    .flow { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow-start); }
    .scrape { stroke: #6e7781; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    .head { fill: #6e7781; }
    .divider { stroke: #6e7781; stroke-width: 1; opacity: 0.4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M10 0L0 5L10 10z"/>
    </marker>
  </defs>

  <text class="title" x="20" y="24">Endpoint picker: prequal-epp</text>

  <rect class="box" x="20" y="100" width="80" height="40" rx="6"/>
  <text x="60" y="125" text-anchor="middle">Clients</text>
  <rect class="box" x="150" y="100" width="110" height="40" rx="6"/>
  <text x="205" y="125" text-anchor="middle">Envoy gateway</text>
  <rect class="ours" x="150" y="210" width="110" height="40" rx="6"/>
  <text x="205" y="235" text-anchor="middle">prequal-epp</text>

  <rect class="group" x="320" y="50" width="110" height="200" rx="8"/>
  <text class="small" x="375" y="42" text-anchor="middle">vLLM / SGLang</text>
  <rect class="box" x="332" y="64" width="86" height="34" rx="6"/>
  <text x="375" y="86" text-anchor="middle">replica</text>
  <rect class="box" x="332" y="103" width="86" height="34" rx="6"/>
  <text x="375" y="125" text-anchor="middle">replica</text>
  <rect class="box" x="332" y="142" width="86" height="34" rx="6"/>
  <text x="375" y="164" text-anchor="middle">replica</text>

  <path class="flow" d="M100 120H148"/>
  <path class="flow" d="M260 120H318"/>
  <path class="flow both" d="M205 143V207"/>
  <text class="small" x="213" y="172">ext_proc:</text>
  <text class="small" x="213" y="186">which replica?</text>
  <path class="scrape" d="M260 230H318"/>
  <text class="small" x="289" y="222" text-anchor="middle">/metrics</text>

  <path class="divider" d="M455 20V270"/>

  <text class="title" x="480" y="24">Standalone: prequal-router</text>

  <rect class="box" x="480" y="100" width="80" height="40" rx="6"/>
  <text x="520" y="125" text-anchor="middle">Clients</text>
  <rect class="ours" x="610" y="100" width="120" height="40" rx="6"/>
  <text x="670" y="125" text-anchor="middle">prequal-router</text>

  <rect class="group" x="780" y="50" width="110" height="200" rx="8"/>
  <text class="small" x="835" y="42" text-anchor="middle">vLLM / SGLang</text>
  <rect class="box" x="792" y="64" width="86" height="34" rx="6"/>
  <text x="835" y="86" text-anchor="middle">replica</text>
  <rect class="box" x="792" y="103" width="86" height="34" rx="6"/>
  <text x="835" y="125" text-anchor="middle">replica</text>
  <rect class="box" x="792" y="142" width="86" height="34" rx="6"/>
  <text x="835" y="164" text-anchor="middle">replica</text>

  <path class="flow" d="M560 120H608"/>
  <path class="flow" d="M730 120H778"/>
  <path class="scrape" d="M670 140V230H778"/>
  <text class="small" x="724" y="222" text-anchor="middle">/metrics</text>
</svg>
