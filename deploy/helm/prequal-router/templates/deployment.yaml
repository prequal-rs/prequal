apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prequal-router.fullname" . }}
  labels:
    {{- include "prequal-router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prequal-router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prequal-router.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prequal-router.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=0.0.0.0:{{ .Values.listenPort }}
            - --admin-listen=0.0.0.0:{{ .Values.adminPort }}
            - --k8s-service={{ include "prequal-router.targetNamespace" . }}/{{ .Values.target.service }}
            - --k8s-port={{ .Values.target.port }}
            - --engine={{ .Values.target.engine }}
            - --metrics-path={{ .Values.target.metricsPath }}
            - --policy={{ .Values.policy }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.listenPort }}
            - name: admin
              containerPort: {{ .Values.adminPort }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
