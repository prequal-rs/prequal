# Headless Service naming every picker pod, for the prequal-gossip arm's --gossip-peers.
apiVersion: v1
kind: Service
metadata:
  name: router-epp-peers
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {llm-d-router-gateway: router-epp}
  ports:
    - {name: gossip, port: 9004, protocol: UDP}
