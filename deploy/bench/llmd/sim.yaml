# llm-d-router nightly simulator fleet (see README for deviations). SIM_EXTRA_ARGS is substituted by the driver.
apiVersion: apps/v1
kind: Deployment
metadata: {name: llm-d-sim, namespace: bench, labels: {app: llm-d-sim}}
spec:
  replicas: 10
  selector: {matchLabels: {app: llm-d-sim}}
  template:
    metadata: {labels: {app: llm-d-sim}}
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: IfNotPresent
        args: [--model, Qwen/Qwen3-8B, --port, "8000", --max-model-len, "131072", --max-waiting-queue-length, "2048",
               --inter-token-latency, 1ms, --prefill-time-per-token, 4us, --prefill-overhead, 5ms, --enable-kvcache,
               --kv-cache-size, "10000000", --block-size, "16", --force-dummy-tokenizer, SIM_EXTRA_ARGS]
        env:
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        ports: [{containerPort: 8000, name: http}, {containerPort: 5557, name: zmq-kv-events}]
        readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 15, periodSeconds: 10}
        resources: {requests: {cpu: 100m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: llm-d-sim-svc, namespace: bench, labels: {app: llm-d-sim}}
spec:
  selector: {app: llm-d-sim}
  ports: [{name: http, port: 8000, targetPort: 8000}]
